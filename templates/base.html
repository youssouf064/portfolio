<!-- SCRIPT DE COMPTEUR GLOBAL SYNCHRONISÉ (CounterAPI) -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Nom de votre espace et clé unique pour votre portfolio
    const namespace = "youssouf-portfolio-2026";
    const key = "visits";

    // Appel à l'API pour augmenter le compteur global de +1 à chaque visite
    fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
      .then(response => response.json())
      .then(data => {
        if (data && data.count !== undefined) {
          document.getElementById('visit-count').innerText = data.count;
        } else {
          // Si le compteur n'est pas encore créé, on lit la valeur
          fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`)
            .then(res => res.json())
            .then(readData => {
              document.getElementById('visit-count').innerText = readData.count || "1";
            });
        }
      })
      .catch(error => {
        console.error("Erreur compteur:", error);
        document.getElementById('visit-count').innerText = "--";
      });
  });
</script>
