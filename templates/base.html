<!-- NOUVEAU SCRIPT DE COMPTEUR GLOBAL SYNC -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Clé unique pour votre portfolio
    const siteId = 'youssouf-seme-portfolio-2026';
    
    // URL de l'API publique Hits
    const apiUrl = `https://hits.seeyoufarm.com/api/count/incr/badge.json?url=https%3A%2F%2Fportfolio-youssouf-seme.onrender.com%2F${siteId}&count_bg=%237B1E7B&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        // Extraction de la valeur globale des vues
        if (data && data.value) {
          document.getElementById('visit-count').innerText = data.value;
        } else {
          // Alternative via API directe si le format d'image est renvoyé
          fetchCountFromAPI();
        }
      })
      .catch(err => {
        // Service de secours Countik si le premier est bloqué
        fetch('https://api.counterapi.dev/v1/youssouf-seme-portfolio/views/up')
          .then(res => res.json())
          .then(data => {
            document.getElementById('visit-count').innerText = data.count || "1";
          })
          .catch(() => {
            document.getElementById('visit-count').innerText = "1";
          });
      });
  });
</script>
