<html lang="fr">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/">
    Youssouf Seme
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto align-items-lg-center">

<li class="nav-item">
<a class="nav-link" href="/">Accueil</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/about">À propos</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/services">Services</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/skills">Compétences</a>
</li>

<li class="nav-item">

</li>

<li class="nav-item">

</li>

<li class="nav-item">

</li>

</li>

<!-- Compteur de vues avec icône d'œil -->
<li class="nav-item ms-lg-3 mt-2 mt-lg-0">
  <span class="badge bg-secondary d-inline-flex align-items-center gap-2 px-3 py-2" title="Vues totales du portfolio">
    <i class="fa-regular fa-eye"></i>
    <span id="visit-count">...</span>
  </span>
</li>

</ul>

</div>

</div>
</nav>

<div class="container mt-5">

{% block content %}

{% endblock %}

</div>

<!-- Bootstrap JS (Nécessaire pour le fonctionnement du menu hamburger sur mobile) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script du compteur de vues -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const namespace = 'youssouf-seme-portfolio';
    const key = 'total-views';

    // Si le visiteur n'a pas encore visité dans cette session, on incrémente (+1)
    if (!sessionStorage.getItem('portfolio_visited')) {
      fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('visit-count').innerText = data.value;
          sessionStorage.setItem('portfolio_visited', 'true');
        })
        .catch(err => {
          console.error("Erreur d'accès au compteur :", err);
          document.getElementById('visit-count').innerText = "1";
        });
    } else {
      // Sinon, on récupère juste la valeur actuelle sans ajouter +1
      fetch(`https://api.countapi.xyz/get/${namespace}/${key}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('visit-count').innerText = data.value;
        })
        .catch(() => {
          document.getElementById('visit-count').innerText = "1";
        });
    }
  });
</script>

</body>
</html>
